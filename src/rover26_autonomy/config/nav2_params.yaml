# ═══════════════════════════════════════════════════════════════════════════════
# rover26 — Nav2 Parameters
# ═══════════════════════════════════════════════════════════════════════════════
# ALL FIXES APPLIED (accumulated across tuning sessions):
#
#   [FIX-TURN]      PathAngleCritic raised, PreferForward lowered, wz_std raised
#                   → robot commits to sharp turns instead of cutting corners
#
#   [FIX-GOAL]      xy/yaw tolerances set, GoalCritic threshold tightened
#                   → robot stops on the goal instead of replanning nearby
#
#   [FIX-CIRCLE]    GoalAngleCritic threshold matched, GoalCritic weight reduced
#                   → no more circular orbits near goal
#
#   [FIX-OBSTACLE]  cost_scaling_factor lowered, inflation_radius tuned for 4m lane
#   [FIX-OBSTACLE]  cost_penalty + analytic_expansion_max_cost added to planner
#                   → planner routes away from obstacles, not toward them
#
#   [FIX-SLOW]      CostCritic weight reduced, PreferForward balanced
#                   → robot maintains speed near obstacles
#
#   [FIX-SMOOTH]    Planner smoother weights raised, refinement passes increased
#                   → cleaner, smoother paths through the lane
#
#   [FIX-REPLAN]    BT switched to replan-only-if-invalid, planner freq lowered
#                   → path locked after initial plan, not replanned constantly
#
#   [FIX-BACKWARD]  REEDS_SHEPP replaces DUBIN
#                   → planner uses short reverse instead of full forward loop
#
#   [FIX-OSCILLATE] PathAlignCritic weight + occupancy ratio loosened,
#                   PathFollowCritic weight reduced, XY tolerance widened
#                   → robot doesn't oscillate trying to snap exactly to path
# ═══════════════════════════════════════════════════════════════════════════════

amcl:
  ros__parameters:
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    # [FIX-REPLAN] Plans once per goal, only replans if the path becomes
    # physically blocked. Default BT replans at 1Hz continuously.
    # Since lane_goal_publisher sends a new NavigateToPose per waypoint,
    # each new goal gets exactly one planning call then locks.
    # Replans on a 1Hz timer — always recomputes shortest path around
    # any new obstacles detected mid-execution. Best for dynamic environments.
    default_nav_to_pose_bt_xml: "/opt/ros/jazzy/share/nav2_bt_navigator/behavior_trees/navigate_w_replanning_time.xml"
    # Replan rate in seconds (navigate_w_replanning_time.xml uses this).
    # 1.0 = replan every second. Lower = more responsive, more CPU.
    replan_only_if_path_is_changed: false
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      # Was 10.0s — too short. Near obstacles the robot legitimately
      # slows down and may take longer than 10s to clear. At 20.0s it
      # has enough time to navigate around without being aborted.
      movement_time_allowance: 20.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      # BACKUP CHECKER — lane_goal_publisher._check_goal_proximity() fires
      # first at 10Hz on XY only, cancelling the Nav2 goal before this
      # checker evaluates it. These values are a safety net for edge cases.
      # [FIX-OSCILLATE] Was 0.20m — too tight caused oscillation trying to
      # land exactly on the waypoint. At 0.65m matches config_params.XY_GOAL_TOL.
      xy_goal_tolerance: 0.65
      # Yaw tolerance used as a soft backup gate. Loose enough that heading
      # noise at intermediate stepping-stone waypoints doesn't block completion,
      # tight enough to be meaningful if Nav2's checker fires independently.
      # 0.5 rad ≈ 28° — rover can be up to 28° off heading and still succeed.
      yaw_goal_tolerance: 0.50

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      # Was 56 — at 0.05s per step that's 2.8s lookahead. At 80 steps
      # MPPI sees 4.0s ahead and can plan around obstacles earlier.
      time_steps: 80
      model_dt: 0.05
      # Was 1000 — near obstacles more samples = better chance of finding
      # a valid trajectory that threads around the obstacle. 2000 doubles
      # exploration without significant CPU cost on modern hardware.
      batch_size: 3000
      iteration_count: 3
      temperature: 0.1
      gamma: 0.015
      motion_model: "DiffDrive"
      visualize: false
      regenerate_noises: true
      prune_distance: 8.0
      transform_tolerance: 0.1

      vx_std: 0.6
      vy_std: 0.2
      # [FIX-TURN] Was 0.4 — MPPI never sampled tight-turn trajectories.
      # At 0.65 the optimizer explores sharp rotation candidates.
      wz_std: 0.65

      vx_max: 5.0
      # Negative vx_min enables reverse motion for Reeds-Shepp path segments.
      vx_min: -1.0
      vy_max: 0.5
      wz_max: 1.9

      ax_max: 6.0
      ax_min: -6.0
      ay_max: 3.0
      ay_min: -3.0
      az_max: 3.5

      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3

      AckermannConstraints:
        min_turning_r: 0.2

      critics: [
        "ConstraintCritic", "CostCritic", "GoalCritic",
        "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic",
        "PathAngleCritic", "PreferForwardCritic"]

      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0

      GoalCritic:
        enabled: true
        cost_power: 1
        # [FIX-CIRCLE] Was 8.0 — pulled too hard from too far, fought
        # PathFollowCritic and produced circular orbits.
        cost_weight: 5.0
        # [FIX-CIRCLE] Was 1.5m — GoalCritic activated too early and fought
        # PathFollowCritic across the whole final approach.
        # At 0.8m the handoff from path-following to goal-homing is clean.
        threshold_to_consider: 0.8

      GoalAngleCritic:
        enabled: true
        cost_power: 1
        # Kept enabled — with REEDS_SHEPP the planner now generates paths
        # that achieve goal heading via reverse maneuver, so GoalAngleCritic
        # and the path work together instead of producing circles.
        cost_weight: 3.0
        # Activates at same distance as GoalCritic for coordinated final approach.
        threshold_to_consider: 0.8

      PreferForwardCritic:
        enabled: true
        cost_power: 1
        # High forward bias — robot keeps moving on open straights and through
        # the lane without hesitating. Reeds-Shepp reverse still works near goal
        # because GoalCritic + GoalAngleCritic override this when close enough.
        cost_weight: 10.0
        # [FIX-TURN] Wider threshold so the critic doesn't suppress sharp turns.
        threshold_to_consider: 0.5

      CostCritic:
        # Re-enabled at minimal weight — just enough for MPPI to be aware of
        # obstacle positions when sampling trajectories. Without this, MPPI
        # samples trajectories blindly and near obstacles finds no valid ones,
        # outputting zero velocity and stopping the robot.
        # At 0.5 the cost is too low to cause braking but high enough to steer
        # sampled trajectories away from the obstacle so MPPI always has
        # valid forward options to pick from.
        enabled: true
        cost_power: 1
        cost_weight: 0.5
        near_collision_cost: 253
        # High critical_cost so only truly lethal cells (right at obstacle)
        # trigger emergency stop — not normal inflation zone cells.
        critical_cost: 600.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 3

      PathAlignCritic:
        enabled: true
        cost_power: 1
        # [FIX-OSCILLATE] Was 14.0 — snapped robot hard to path centreline.
        # Any drift triggered aggressive correction → oscillation.
        cost_weight: 8.0
        # [FIX-OSCILLATE] Was 0.05 — 95% of trajectory had to be on-path.
        # Extremely tight, any wobble caused a full correction cycle.
        # At 0.15: robot can be off-path for 15% of trajectory without correction.
        max_path_occupancy_ratio: 0.15
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        # [FIX-TURN] Was 20 — targeted past the bend in sharp curves, causing
        # corner-cutting. At 10 the reference point stays inside the curve.
        offset_from_furthest: 10
        use_path_orientations: false

      PathFollowCritic:
        enabled: true
        cost_power: 1
        # [FIX-OSCILLATE] Was 5.0 — combined with PathAlignCritic caused
        # the robot to snap aggressively back to path after any deviation.
        cost_weight: 3.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4

      PathAngleCritic:
        enabled: true
        cost_power: 1
        # [FIX-TURN] Was 2.0 — robot barely cared about heading at curves.
        # At 6.5 it actively rotates to face the path direction in sharp turns.
        cost_weight: 6.5
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        # [FIX-TURN] Was 1.0 rad (~57°) — tolerated huge heading errors.
        # At 0.5 rad (~29°) heading correction triggers much earlier.
        max_angle_to_furthest: 0.5
        mode: 0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      # Was 3m — obstacles just ahead were outside the planning window.
      # At 8m the planner sees and routes around them before committing.
      width: 8
      height: 8
      resolution: 0.05
      footprint: "[[0.25, 0.35], [0.25, -0.35], [-0.25, -0.35], [-0.25, 0.35]]"
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # [FIX-OBSTACLE] Was 3.0 — costs fell off quickly (steep gradient),
        # leaving a cheap fringe the planner threaded through.
        # Lower value = slower cost decay = wider expensive band around obstacles.
        # At 1.5 the gradient stays expensive all the way to inflation_radius,
        # making the planner genuinely route around objects.
        cost_scaling_factor: 5.0
        # [FIX-OBSTACLE] Was 0.55m. Lane is 4m wide, robot inscribed radius
        # is 0.25m. 0.7m gives 0.45m safety margin well within the lane width.
        inflation_radius: 0.50
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0

global_costmap:
  global_costmap:
    ros__parameters:
      # Was 1.0Hz — obstacle marks were stale when planner ran.
      # At 3.0Hz global costmap reflects LiDAR hits quickly.
      update_frequency: 3.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_link
      robot_radius: 0.25
      resolution: 0.05
      track_unknown_space: true
      # Keeps costmap centred on robot — without this the costmap locks
      # to static map bounds and stops updating around the robot.
      rolling_window: true
      width: 20
      height: 20
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Tight gradient — costs drop fast from obstacle edge.
        cost_scaling_factor: 5.0
        inflation_radius: 0.50
      always_send_full_costmap: True

map_saver:
  ros__parameters:
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 10.0
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 1.0
    GridBased:
      plugin: "nav2_theta_star_planner::ThetaStarPlanner"
      how_many_corners: 8
      # 10:1 ratio — distance dominates completely.
      # Planner goes straight to goal, minimum detour around obstacles only.
      w_euc_cost: 10.0
      w_traversal_cost: 1.0
      w_heuristic_param: 1.0 = optimal shortest path guaranteed.
      w_heuristic_param: 1.0
smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

route_server:
  ros__parameters:
    boundary_radius_to_achieve_node: 1.0
    radius_to_achieve_node: 2.0
    smooth_corners: true
    operations: ["AdjustSpeedLimit", "ReroutingService", "CollisionMonitor"]
    ReroutingService:
      plugin: "nav2_route::ReroutingService"
    AdjustSpeedLimit:
      plugin: "nav2_route::AdjustSpeedLimit"
    CollisionMonitor:
      plugin: "nav2_route::CollisionMonitor"
      max_collision_dist: 3.0
    edge_cost_functions: ["DistanceScorer", "CostmapScorer"]
    DistanceScorer:
      plugin: "nav2_route::DistanceScorer"
    CostmapScorer:
      plugin: "nav2_route::CostmapScorer"

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    stamp_smoothed_velocity_with_smoothing_time: False
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [5.0, 0.0, 2.5]
    min_velocity: [-1.0, 0.0, -2.5]
    max_accel: [6.0, 0.0, 3.2]
    max_decel: [-6.0, 0.0, -3.2]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.1, 0.0, 0.0]
    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      # Was 1.2s — at 0.5m/s this stopped the robot 0.6m before any obstacle.
      # 0.3s = stops only when obstacle is 0.15m away. CollisionMonitor is a
      # last-resort hard stop, not a speed regulator. Let MPPI handle the rest.
      time_before_collision: 0.3
      simulation_time_step: 0.1
      min_points: 6
      visualize: False
      enabled: True
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "scan"
      min_height: 0.15
      max_height: 2.0
      enabled: True

docking_server:
  ros__parameters:
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: "base_link"
    fixed_frame: "odom"
    dock_backwards: false
    dock_prestaging_tolerance: 0.5
    dock_plugins: ['simple_charging_dock']
    simple_charging_dock:
      plugin: 'opennav_docking::SimpleChargingDock'
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: true
      use_battery_status: false
      use_stall_detection: false
      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1
    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.15
      v_linear_max: 0.15
      use_collision_detection: true
      costmap_topic: "local_costmap/costmap_raw"
      footprint_topic: "local_costmap/published_footprint"
      transform_tolerance: 0.1
      projection_time: 5.0
      simulation_step: 0.1
      dock_collision_threshold: 0.3

loopback_simulator:
  ros__parameters:
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    map_frame_id: "map"
    scan_frame_id: "base_scan"
    update_duration: 0.02
    scan_range_min: 0.05
    scan_range_max: 30.0
    scan_angle_min: -3.1415
    scan_angle_max: 3.1415
    scan_angle_increment: 0.02617
    scan_use_inf: true