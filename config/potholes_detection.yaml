camera_name: fisheye_camera
frame_width: 640
frame_height: 480
use_fisheye: false
calibration_file: /calibration/fisheye_calibration.npz
balance: 0.0

# White target detection thresholds
hsv_lower: [0, 0, 200]
hsv_upper: [180, 40, 255]
gray_threshold: 220
open_kernel_size: 3
close_kernel_size: 5
blur_kernel_size: 5
blur_sigma: 0.0
min_area: 500
max_area: 30000
min_circularity: 0.65